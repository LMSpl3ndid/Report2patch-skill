version: 1

paths:
  patch_output_dir: "$PWD/patch"
  kasan_artifact_dir: "/tmp/<function-or-bug-tag>"
  repro_markdown_path: "${kasan_artifact_dir}/repro-steps.md"
  commit_draft_path: "${kernel_tree}/tools/testing/report2patch/${work_branch}/commit.md"

git:
  base_branch: "master"
  update_base_branch: true
  update_command: "git pull --ff-only"
  work_branch_strategy: "bug_function_name"

runtime:
  require_configured_linux_build_options: true
  require_qemu: true
  qemu_root_password: "root"
  require_kasan_report: true
  require_repro_markdown: true
  repro_markdown_format: "markdown"

submission:
  require_commit_self_check: true
  commit_message_starts_from: "Subject:"
  require_send_email_command_format: true
  require_checkpatch: true
  require_get_maintainer: true
  require_commit_draft_file: true
